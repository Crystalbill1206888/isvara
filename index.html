<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 三模型辩论系统 - isvara</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .control-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .control-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-area {
            margin-bottom: 30px;
        }

        .input-area label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .result-section {
            margin-bottom: 30px;
        }

        .result-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .model-result {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .model-result:hover {
            background: #f0f0f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .model-result.collapsed .content {
            display: none;
        }

        .model-result .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .model-result .header .toggle {
            color: #667eea;
            font-size: 12px;
        }

        .model-result .content {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .final-answer {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .final-answer .title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .final-answer .content {
            color: #555;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .error {
            background: #fee;
            border-left: 4px solid #f44;
            padding: 15px;
            border-radius: 4px;
            color: #c33;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI 三模型辩论系统</h1>
            <p>三个 AI 模型并行作答、互相核验、综合分析</p>
        </div>

        <div class="control-panel">
            <div class="control-group">
                <label for="temperatureInput">温度 (0.0-1.0)</label>
                <input type="number" id="temperatureInput" min="0" max="1" step="0.1" value="0.7">
            </div>
        </div>

        <div class="input-area">
            <label for="questionInput">输入您的问题</label>
            <textarea id="questionInput" placeholder="请输入您想要 AI 回答的问题..."></textarea>
        </div>

        <div class="button-group">
            <button class="btn-submit" id="submitBtn">提交问题</button>
            <button class="btn-clear" id="clearBtn">清空</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在处理中，请稍候...</p>
        </div>

        <div class="results" id="results">
            <div id="messageContainer"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://1354698699-21m65ka643.ap-guangzhou.tencentscf.com';
        
        const elements = {
            temperatureInput: document.getElementById('temperatureInput'),
            questionInput: document.getElementById('questionInput'),
            submitBtn: document.getElementById('submitBtn'),
            clearBtn: document.getElementById('clearBtn'),
            loading: document.getElementById('loading'),
            results: document.getElementById('results'),
            messageContainer: document.getElementById('messageContainer')
        };

        elements.clearBtn.addEventListener('click', () => {
            elements.questionInput.value = '';
            elements.results.style.display = 'none';
            elements.messageContainer.innerHTML = '';
        });

        elements.submitBtn.addEventListener('click', async () => {
            const question = elements.questionInput.value.trim();
            if (!question) {
                alert('请输入问题');
                return;
            }

            const temperature = parseFloat(elements.temperatureInput.value);

            await submitQuestion(question, temperature);
        });

        elements.questionInput.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                elements.submitBtn.click();
            }
        });

        async function submitQuestion(question, temperature) {
            elements.submitBtn.disabled = true;
            elements.loading.style.display = 'block';
            elements.results.style.display = 'none';
            elements.messageContainer.innerHTML = '';

            try {
                const payload = {
                    body: JSON.stringify({
                        goal: question,
                        model: 'debate',
                        temperature: temperature,
                        agent: false,
                        messages: [],
                        use_tools: false
                    })
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                displayError(`请求失败: ${error.message}`);
            } finally {
                elements.submitBtn.disabled = false;
                elements.loading.style.display = 'none';
            }
        }

        function displayResults(data) {
            elements.results.style.display = 'block';
            let html = '';

            if (data.debate_results) {
                const results = data.debate_results;

                html += '<div class="result-section">';
                html += '<div class="result-title">📝 第一轮：三模型原始答案</div>';

                if (results.round1) {
                    ['qwen', 'deepseek', 'hunyuan'].forEach(modelKey => {
                        const modelName = {
                            'qwen': '千问 (Qwen-Plus)',
                            'deepseek': '硅基 · DeepSeek-V3',
                            'hunyuan': '硅基 · 混元'
                        }[modelKey];

                        html += `
                            <div class="model-result" onclick="toggleResult(this)">
                                <div class="header">
                                    <span>${modelName}</span>
                                    <span class="toggle">▼ 展开</span>
                                </div>
                                <div class="content">${escapeHtml(results.round1[modelKey] || '(无回复)')}</div>
                            </div>
                        `;
                    });
                }
                html += '</div>';

                html += '<div class="result-section">';
                html += '<div class="result-title">🔍 第二轮：三模型互相核验</div>';

                if (results.round2) {
                    ['qwen', 'deepseek', 'hunyuan'].forEach(modelKey => {
                        const modelName = {
                            'qwen': '千问 (Qwen-Plus)',
                            'deepseek': '硅基 · DeepSeek-V3',
                            'hunyuan': '硅基 · 混元'
                        }[modelKey];

                        html += `
                            <div class="model-result" onclick="toggleResult(this)">
                                <div class="header">
                                    <span>${modelName} 的核验意见</span>
                                    <span class="toggle">▼ 展开</span>
                                </div>
                                <div class="content">${escapeHtml(results.round2[modelKey] || '(无回复)')}</div>
                            </div>
                        `;
                    });
                }
                html += '</div>';

                if (results.final_answer) {
                    html += `
                        <div class="final-answer">
                            <div class="title">✨ 最终综合答案 (DeepSeek 综合)</div>
                            <div class="content">${escapeHtml(results.final_answer)}</div>
                        </div>
                    `;
                }
            } else {
                displayError('未收到辩论结果');
                return;
            }

            elements.messageContainer.innerHTML = html;
        }

        function displayError(message) {
            elements.results.style.display = 'block';
            elements.messageContainer.innerHTML = `<div class="error">❌ ${escapeHtml(message)}</div>`;
        }

        function toggleResult(element) {
            element.classList.toggle('collapsed');
            const toggle = element.querySelector('.toggle');
            if (element.classList.contains('collapsed')) {
                toggle.textContent = '▶ 展开';
            } else {
                toggle.textContent = '▼ 收起';
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
